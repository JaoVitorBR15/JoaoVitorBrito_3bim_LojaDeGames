<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Store | Entrar</title>
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/login.css">
</head>
<body>
    <header class="site-header">
        <div class="container header-content">
            <a class="logo" href="index.html">🎮 Game Store</a>
            <nav>
                <a href="index.html">Início</a>
                <a href="jogos.html">Jogos</a>
                <a class="active" href="login.html">Entrar / Cadastrar</a>
            </nav>
        </div>
    </header>

    <main class="container auth-page">
        <section class="auth-intro">
            <p class="eyebrow">BEM-VINDO À GAME STORE</p>
            <h1>Acesse sua conta</h1>
            <p>Entre para acessar sua conta. Administradores podem gerenciar o catálogo e os cadastros.</p>
        </section>

        <div id="mensagem" class="message hidden" role="status" aria-live="polite"></div>

        <div class="auth-grid">
            <section class="panel">
                <h2>Entrar</h2>
                <form id="formLogin">
                    <label for="emailLogin">E-mail</label>
                    <input id="emailLogin" name="email" type="email" autocomplete="username" required>

                    <label for="senhaLogin">Senha</label>
                    <input id="senhaLogin" name="senha" type="password" autocomplete="current-password" required>

                    <button class="btn btn-primary auth-button" type="submit">Entrar</button>
                </form>
            </section>

            <section class="panel">
                <h2>Criar conta de cliente</h2>
                <form id="formCadastro">
                    <label for="nomeCadastro">Nome completo</label>
                    <input id="nomeCadastro" name="nome" type="text" maxlength="100" autocomplete="name" required>

                    <label for="emailCadastro">E-mail</label>
                    <input id="emailCadastro" name="email" type="email" maxlength="150" autocomplete="email" required>

                    <label for="telefoneCadastro">Telefone (opcional)</label>
                    <input id="telefoneCadastro" name="telefone" type="tel" maxlength="20" autocomplete="tel">

                    <label for="senhaCadastro">Senha (mínimo de 8 caracteres)</label>
                    <input id="senhaCadastro" name="senha" type="password" minlength="8" maxlength="128" autocomplete="new-password" required>

                    <button class="btn btn-secondary auth-button" type="submit">Criar conta</button>
                </form>
            </section>
        </div>

        <section class="panel session-panel hidden" id="painelSessao">
            <h2>Sua sessão</h2>
            <p id="dadosUsuario"></p>
            <button class="btn btn-danger" id="btnSair" type="button">Sair da conta</button>
        </section>
    </main>

    <footer class="site-footer">
        <div class="container">
            <p>Projeto de Desenvolvimento Web 1</p>
        </div>
    </footer>
    <script src="js/login.js"></script>
</body>
</html>
